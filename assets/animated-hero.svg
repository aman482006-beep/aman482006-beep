<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Aman Malu — Finance and Analytics</title>
  <desc id="desc">A warm, light editorial banner with a restrained animated line chart.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF9F5"/>
      <stop offset="1" stop-color="#F1F0E8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#245B4B"/>
      <stop offset="1" stop-color="#7B9561"/>
    </linearGradient>
  </defs>
  <style>
    .draw {
      fill: none; stroke: url(#ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 530; stroke-dashoffset: 530;
      animation: draw 14s cubic-bezier(.65,0,.35,1) infinite;
    }
    .dot { animation: dot 14s ease-in-out infinite; }
    @keyframes draw {
      0%, 8% { stroke-dashoffset: 530; opacity: .35; }
      55%, 86% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: .75; }
    }
    @keyframes dot {
      0%, 54% { opacity: 0; }
      62%, 90% { opacity: 1; }
      100% { opacity: .6; }
    }
    @media (prefers-reduced-motion: reduce) {
      .draw, .dot { animation: none; }
      .draw { stroke-dashoffset: 0; }
      .dot { opacity: 1; }
    }
  </style>
  <rect width="1200" height="260" rx="4" fill="url(#paper)"/>
  <rect x=".5" y=".5" width="1199" height="259" fill="none" stroke="#DADCD2"/>
  <text x="54" y="38" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.1" fill="#68736A">FINANCE  /  ANALYTICS  /  SOFTWARE</text>
  <path d="M54 54 H1146" stroke="#DADCD2"/>
  <text x="52" y="133" font-family="Georgia, 'Times New Roman', serif" font-size="65" letter-spacing="-2.1" fill="#202A25">Aman Malu</text>
  <text x="56" y="169" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#59655D">Building tools at the intersection of markets and technology.</text>
  <path d="M56 206 H564" stroke="#DADCD2"/>
  <path d="M56 206 H160" stroke="#245B4B" stroke-width="2"/>
  <text x="56" y="229" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#68736A">BENGALURU, INDIA</text>
  <g opacity=".75" stroke="#D7DCD2" stroke-width="1">
    <path d="M696 82 V206"/><path d="M780 82 V206"/><path d="M864 82 V206"/>
    <path d="M948 82 V206"/><path d="M1032 82 V206"/><path d="M1116 82 V206"/>
    <path d="M696 82 H1146"/><path d="M696 123 H1146"/><path d="M696 164 H1146"/><path d="M696 206 H1146"/>
  </g>
  <path d="M696 194 L758 178 L814 185 L874 143 L930 153 L990 113 L1048 130 L1097 94 L1146 76" fill="none" stroke="#BFCBBC" stroke-width="1.4"/>
  <path class="draw" d="M696 194 L758 178 L814 185 L874 143 L930 153 L990 113 L1048 130 L1097 94 L1146 76"/>
  <circle class="dot" cx="1146" cy="76" r="3.5" fill="#245B4B"/>
  <text x="696" y="229" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1.3" fill="#68736A">OBSERVE  →  ANALYSE  →  BUILD</text>
</svg>