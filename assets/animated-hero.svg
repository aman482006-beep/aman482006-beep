<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Aman Malu — Finance, Analytics and AI</title>
  <desc id="desc">A premium animated dark navy banner with glowing teal and violet orbits, moving light trails and a fintech-inspired interface.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060914"/>
      <stop offset=".55" stop-color="#0B1225"/>
      <stop offset="1" stop-color="#10142A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".45" stop-color="#22D3EE" stop-opacity=".8"/>
      <stop offset=".75" stop-color="#A78BFA" stop-opacity=".7"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="auraA">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraB">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity=".07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#67E8F9" fill-opacity=".16"/>
    </pattern>
    <filter id="blur32" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <style>
    .floatA{animation:floatA 8s ease-in-out infinite}
    .floatB{animation:floatB 10s ease-in-out infinite}
    .orbit{transform-origin:930px 175px;animation:orbit 26s linear infinite}
    .orbitReverse{transform-origin:930px 175px;animation:orbit 34s linear infinite reverse}
    .dash{stroke-dasharray:10 16;animation:dash 7s linear infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
    .beam{animation:beam 8s ease-in-out infinite}
    .spark{animation:spark 4.5s ease-in-out infinite}
    @keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-12px)}}
    @keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-12px,10px)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes dash{to{stroke-dashoffset:-208}}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
    @keyframes beam{0%,100%{transform:translateX(-180px);opacity:0}18%{opacity:.75}78%{opacity:.5}90%{transform:translateX(1250px);opacity:0}}
    @keyframes spark{0%,100%{opacity:.25}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.floatA,.floatB,.orbit,.orbitReverse,.dash,.pulse,.beam,.spark{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" rx="24" fill="url(#base)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="175" cy="30" rx="310" ry="230" fill="url(#auraA)" filter="url(#blur32)"/>
    <ellipse cx="1030" cy="260" rx="330" ry="250" fill="url(#auraB)" filter="url(#blur32)"/>
    <ellipse class="floatA" cx="860" cy="56" rx="230" ry="115" fill="url(#auraA)" filter="url(#blur32)"/>
    <path d="M0 278 C190 248 310 310 500 270 S830 232 1200 275" fill="none" stroke="#22D3EE" stroke-opacity=".12" stroke-width="1"/>
    <path d="M0 292 C210 264 330 322 550 282 S870 248 1200 290" fill="none" stroke="#A78BFA" stroke-opacity=".1" stroke-width="1"/>
    <g opacity=".75">
      <circle class="spark" cx="720" cy="66" r="1.8" fill="#A5F3FC"/>
      <circle class="spark" cx="1100" cy="74" r="1.5" fill="#C4B5FD" style="animation-delay:1.1s"/>
      <circle class="spark" cx="1080" cy="282" r="1.8" fill="#BEF264" style="animation-delay:2.1s"/>
      <circle class="spark" cx="675" cy="260" r="1.2" fill="#67E8F9" style="animation-delay:.7s"/>
      <circle class="spark" cx="795" cy="116" r="1.3" fill="#A5B4FC" style="animation-delay:1.6s"/>
    </g>
    <g transform="translate(72 58)">
      <rect width="220" height="29" rx="14.5" fill="#101D31" stroke="#334155" stroke-opacity=".9"/>
      <circle cx="16" cy="14.5" r="4" fill="#A3E635" class="pulse"/>
      <text x="29" y="19" fill="#C8D5E7" font-size="11" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="2.1">INDEPENDENTLY CURIOUS</text>
    </g>
    <text x="68" y="164" fill="#F8FAFC" font-size="62" font-weight="750" letter-spacing="-2.6" font-family="Inter,Segoe UI,Arial,sans-serif">AMAN MALU</text>
    <rect x="72" y="184" width="88" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="220" fill="#B9C7DA" font-size="18" font-weight="500" letter-spacing="2.4" font-family="Inter,Segoe UI,Arial,sans-serif">FINANCE  <tspan fill="#22D3EE">×</tspan>  ANALYTICS  <tspan fill="#818CF8">×</tspan>  AI</text>
    <text x="72" y="253" fill="#8596AE" font-size="13" letter-spacing=".5" font-family="Inter,Segoe UI,Arial,sans-serif">Turning data and ideas into useful systems.</text>
    <g transform="translate(72 294)">
      <rect width="98" height="28" rx="7" fill="#0E2231" stroke="#155E75" stroke-opacity=".8"/>
      <text x="49" y="18" fill="#67E8F9" font-size="10" text-anchor="middle" letter-spacing="1.3" font-family="Inter,Segoe UI,Arial,sans-serif">FINTECH</text>
      <rect x="108" width="112" height="28" rx="7" fill="#171D35" stroke="#4338CA" stroke-opacity=".75"/>
      <text x="164" y="18" fill="#C4B5FD" font-size="10" text-anchor="middle" letter-spacing="1.3" font-family="Inter,Segoe UI,Arial,sans-serif">AUTOMATION</text>
      <rect x="230" width="92" height="28" rx="7" fill="#1D2719" stroke="#4D7C0F" stroke-opacity=".85"/>
      <text x="276" y="18" fill="#BEF264" font-size="10" text-anchor="middle" letter-spacing="1.3" font-family="Inter,Segoe UI,Arial,sans-serif">BUILDING</text>
    </g>
    <path d="M650 45 V315" stroke="#64748B" stroke-opacity=".25"/>
    <g class="floatA">
      <circle cx="930" cy="175" r="118" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1"/>
      <circle cx="930" cy="175" r="88" fill="none" stroke="#334155" stroke-opacity=".7" stroke-width="1"/>
      <circle cx="930" cy="175" r="58" fill="#101A2B" stroke="#475569" stroke-opacity=".7"/>
      <circle cx="930" cy="175" r="45" fill="#101B2A" stroke="url(#accent)" stroke-width="1.5" filter="url(#glow)"/>
      <path d="M902 178 L919 160 L934 171 L956 147" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <path d="M902 188 H956" stroke="#64748B" stroke-opacity=".5" stroke-width="1"/>
      <circle cx="902" cy="178" r="3.5" fill="#22D3EE"/>
      <circle cx="919" cy="160" r="3.5" fill="#67E8F9"/>
      <circle cx="934" cy="171" r="3.5" fill="#A78BFA"/>
      <circle cx="956" cy="147" r="3.5" fill="#BEF264"/>
    </g>
    <g class="orbit">
      <ellipse cx="930" cy="175" rx="148" ry="58" fill="none" stroke="url(#accent)" stroke-opacity=".7" stroke-width="1.5" transform="rotate(-28 930 175)"/>
      <circle cx="1070" cy="103" r="4.5" fill="#67E8F9" filter="url(#glow)"/>
    </g>
    <g class="orbitReverse">
      <ellipse cx="930" cy="175" rx="125" ry="48" fill="none" stroke="#818CF8" stroke-opacity=".65" stroke-width="1.2" stroke-dasharray="4 10" transform="rotate(38 930 175)"/>
      <circle cx="817" cy="130" r="4" fill="#A78BFA" filter="url(#glow)"/>
    </g>
    <g class="floatB">
      <rect x="1000" y="71" width="126" height="44" rx="9" fill="#101C2D" stroke="#334155" stroke-opacity=".9"/>
      <circle cx="1015" cy="87" r="3.5" fill="#A3E635"/>
      <text x="1025" y="90" fill="#D6E2F0" font-size="9" letter-spacing="1" font-family="Inter,Segoe UI,Arial,sans-serif">SIGNAL</text>
      <path d="M1013 103 L1022 96 L1031 100 L1040 91 L1049 96 L1058 86 L1067 89 L1076 80 L1085 84 L1094 75 L1103 79" fill="none" stroke="#A3E635" stroke-opacity=".9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="floatA">
      <rect x="1005" y="235" width="138" height="45" rx="9" fill="#101C2D" stroke="#334155" stroke-opacity=".9"/>
      <text x="1018" y="252" fill="#93A4BB" font-size="9" letter-spacing="1.1" font-family="Inter,Segoe UI,Arial,sans-serif">SYSTEMS THINKING</text>
      <g transform="translate(1018 262)">
        <rect width="11" height="7" rx="2" fill="#22D3EE" opacity=".9"/>
        <rect x="15" width="20" height="7" rx="2" fill="#818CF8" opacity=".9"/>
        <rect x="39" width="15" height="7" rx="2" fill="#A3E635" opacity=".9"/>
        <rect x="58" width="32" height="7" rx="2" fill="#475569"/>
        <rect x="94" width="17" height="7" rx="2" fill="#475569" opacity=".7"/>
      </g>
    </g>
    <rect class="beam" x="0" y="0" width="130" height="360" fill="url(#lineGlow)" opacity=".45"/>
    <path d="M24 22 H42 M24 22 V40 M1176 22 H1158 M1176 22 V40 M24 338 H42 M24 338 V320 M1176 338 H1158 M1176 338 V320" stroke="#67E8F9" stroke-opacity=".45" stroke-width="1.2" fill="none"/>
    <rect x=".5" y=".5" width="1199" height="359" rx="23.5" fill="none" stroke="#64748B" stroke-opacity=".32"/>
  </g>
</svg>