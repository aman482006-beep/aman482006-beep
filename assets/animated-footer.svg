<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="ft">
  <title id="ft">Aman Malu — keep building</title>
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#12172A"/></linearGradient>
  </defs>
  <style>
    .wave1{animation:wave1 8s ease-in-out infinite alternate}.wave2{animation:wave2 11s ease-in-out infinite alternate}.light{animation:light 5s ease-in-out infinite}
    @keyframes wave1{to{transform:translateX(-45px)}}@keyframes wave2{to{transform:translateX(35px)}}@keyframes light{0%,100%{opacity:.25}50%{opacity:.9}}
    @media(prefers-reduced-motion:reduce){.wave1,.wave2,.light{animation:none}}
  </style>
  <rect width="1200" height="100" rx="16" fill="url(#bg)"/>
  <path class="wave1" d="M-30 42 C120 0 200 80 360 42 S600 0 760 42 S1000 80 1230 32" fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="1.3"/>
  <path class="wave2" d="M-30 53 C140 90 230 10 400 53 S630 90 800 53 S1030 10 1230 56" fill="none" stroke="#818CF8" stroke-opacity=".55" stroke-width="1.3"/>
  <path class="light" d="M0 74 H1200" stroke="url(#f)" stroke-opacity=".55" stroke-width="1"/>
  <text x="600" y="42" fill="#E2E8F0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="4">KEEP LEARNING. KEEP BUILDING.</text>
  <text x="600" y="64" fill="#94A3B8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="2">FINANCE  /  ANALYTICS  /  TECHNOLOGY</text>
  <rect x=".5" y=".5" width="1199" height="99" rx="15.5" fill="none" stroke="#475569" stroke-opacity=".3"/>
</svg>